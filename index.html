<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ms. Shih's Island of Chinese Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: one big island map. Each place has a sign; tap a sign to open that place's game menu. */
:root {
  --sea: #BFE3EE;
  --sea-deep: #8CCBDD;
  --sand: #F3DDA6;
  --grass: #B5DB98;
  --grass-deep: #86BD72;
  --ink: #2B2B2B;
  --muted: #5E625E;
  --card: #FFFFFF;
  --line: #CFD2CC;
  --dad: #F2A65A; --dad-ink: #B4471C; --dad-soft: #FFF6E5;
  --mom: #EC8FB3; --mom-ink: #B23D6E; --mom-soft: #FDEEF3;
  --me: #8CC7A0;  --me-ink: #2F7A4D;  --me-soft: #EEF7F1;
  --soon: #B9BDB8;
  --f-zh: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --f-latin: 'Andika', 'Trebuchet MS', system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--sea); color: var(--ink); font-family: var(--f-latin);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.ruby { display: inline-flex; gap: 3px; align-items: flex-end; }
.ruby > span { display: flex; flex-direction: column; align-items: center; }
.ruby .py { line-height: 1.1; white-space: nowrap; }
.ruby .zh { font-family: var(--f-zh); font-weight: 700; line-height: 1.1; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand .en { font-size: clamp(22px, 3vw, 34px); font-weight: 700; color: #1F5E73; line-height: 1.1; }
.brand .ruby .py { font-size: 15px; color: #1F5E73; } .brand .ruby .zh { font-size: 26px; color: #1F5E73; }
.listBtn {
  font: 700 18px var(--f-latin); color: var(--ink); background: var(--card);
  border: 2px solid var(--ink); border-radius: 12px; padding: 10px 16px; cursor: pointer;
}
button:focus-visible, a:focus-visible { outline: 3px solid #1F5E73; outline-offset: 2px; }

.map { position: relative; width: 100%; aspect-ratio: var(--ar, 1000 / 620); }
.goHoliday {
  position: absolute; transform: translate(-50%, -50%); cursor: pointer; font: inherit; color: var(--ink);
  background: #FFFFFF; border: 3px solid var(--ink); border-radius: 12px; padding: 4px 12px 6px; box-shadow: 0 4px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; line-height: 1.1;
}
.goHoliday .py { font-size: clamp(9px, 1vw, 13px); } .goHoliday .zh { font-size: clamp(14px, 1.7vw, 22px); }
.goHoliday .en { font-size: clamp(10px, 1.1vw, 14px); font-weight: 700; color: #8A4FB8; white-space: nowrap; }
.goHoliday:hover { transform: translate(-50%, calc(-50% - 2px)); }
.back {
  font: 700 18px var(--f-latin); color: var(--ink); background: var(--card);
  border: 2px solid var(--ink); border-radius: 12px; padding: 10px 16px; cursor: pointer;
}
.scene { display: flex; flex-direction: column; gap: 12px; }
.scene.enter { animation: zoomIn .45s ease-out; }
@keyframes zoomIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
body.holiday { background: #CBC3E8; }
.list h3 { margin: 4px 0 0; font-size: 20px; color: #1F5E73; }
.map svg.island { position: absolute; inset: 0; width: 100%; height: 100%; }

/* a place sign on the map: tap it to see that place's games */
.spot {
  position: absolute; transform: translate(-50%, -50%); cursor: pointer; font: inherit; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center;
  background: var(--card); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 12px 6px;
  box-shadow: 0 4px 0 var(--c, var(--ink));
}
.spot::before {
  content: ""; position: absolute; top: -9px; right: -9px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--c, var(--me)); border: 2.5px solid var(--ink); animation: bob 2.6s ease-in-out infinite;
}
.spot .py { font-size: clamp(10px, 1.1vw, 14px); } .spot .zh { font-size: clamp(15px, 1.9vw, 24px); }
.spot .en { font-size: clamp(10px, 1.1vw, 14px); font-weight: 700; color: var(--muted); }
.spot:hover { transform: translate(-50%, calc(-50% - 2px)); }
.spot.soon { cursor: default; border-style: dashed; border-color: #8B908A; box-shadow: none; background: rgba(255,255,255,.9); }
.spot.soon::before { display: none; }
.spot.soon:hover { transform: translate(-50%, -50%); }
.spot.soon .zh { color: #4A4E4A; }
.spot.label { cursor: default; box-shadow: none; border-width: 2px; padding: 3px 10px 5px; background: rgba(255,255,255,.92); }
.spot.label::before { display: none; }
.spot.label:hover { transform: translate(-50%, -50%); }
.spot .soonTag { font-size: clamp(9px, 1vw, 12px); color: var(--muted); }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }

.overlay { position: fixed; inset: 0; background: rgba(31,94,115,.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.panel {
  width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--card); border: 3px solid var(--ink);
  border-radius: 20px; box-shadow: 0 6px 0 var(--ink); padding: 18px; display: flex; flex-direction: column; gap: 14px;
}
.panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.panel-head .py { font-size: 16px; } .panel-head .zh { font-size: 34px; }
.panel-head .en { font-size: 18px; font-weight: 700; color: var(--muted); margin-left: 8px; }
.close { font: 700 22px var(--f-latin); width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); cursor: pointer; flex: none; }
.games { display: flex; flex-direction: column; gap: 10px; }
.game {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px;
  border: 3px solid var(--c, var(--me)); background: var(--cs, var(--me-soft)); color: var(--ink); text-decoration: none;
}
.game .ruby .py { font-size: 14px; } .game .ruby .zh { font-size: 26px; }
.game .en { font-weight: 700; font-size: 17px; }
.game small { display: block; color: var(--muted); font-size: 14px; }
.game .go { margin-left: auto; font-size: 26px; font-weight: 700; }

.list { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.list h2 { margin: 0; display: flex; align-items: flex-end; gap: 8px; font-size: 16px; color: var(--muted); }
.list h2 .zh { font-size: 22px; color: var(--ink); }
.list .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.list .soonline { color: var(--muted); font-size: 15px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .spot::before { animation: none; } .scene.enter { animation: none; } }
</style>
</head>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head">
      <div id="panelTitle"></div>
      <button class="close" id="closeBtn" type="button" aria-label="Close">✕</button>
    </div>
    <div class="games" id="panelGames"></div>
  </div>
</div>

<script src="island.js"></script>
<script>
const ISLANDS = window.ISLANDS;
const COLORS = {
  me: ['#8CC7A0', '#EEF7F1'], dad: ['#F2A65A', '#FFF6E5'], mom: ['#EC8FB3', '#FDEEF3'],
  sea: ['#7FC4D8', '#E6F4F8'], sun: ['#F5C531', '#FFF6D6'], night: ['#9B8BC4', '#EFEAF8']
};

function rubyHTML(zh, py) {
  const syl = String(py || '').replace(/[.,?!;:，。？！、\/／]/g, ' ').trim().split(/\s+/).filter(Boolean);
  let k = 0;
  return Array.from(zh).map(c => {
    const p = /[\u3400-\u9fff]/.test(c) ? (syl[k++] || '') : '';
    return `<span><span class="py">${p || '&nbsp;'}</span><span class="zh">${c}</span></span>`;
  }).join('');
}

const overlay = document.getElementById('overlay');
const panelTitle = document.getElementById('panelTitle');
const panelGames = document.getElementById('panelGames');
let lastFocus = null;

function gameCards(t) {
  const [c, cs] = COLORS[t.color] || COLORS.me;
  return t.games.map(g => `<a class="game" href="${g.href}" style="--c:${c};--cs:${cs}">
      <span class="ruby">${rubyHTML(g.zh, g.py)}</span>
      <span><span class="en">${g.en}</span><small>${g.note || ''}</small></span>
      <span class="go" aria-hidden="true">→</span></a>`).join('');
}

Object.entries(ISLANDS).forEach(([id, I]) => {
  const map = document.getElementById('map-' + id);
  const X = v => (v / I.width * 100) + '%', Y = v => (v / 620 * 100) + '%';
  I.places.forEach(P => {
    if (P.labelOnly) {   // just a name sign on the map (a vocabulary word), no games
      const d = document.createElement('div');
      d.className = 'spot label';
      d.style.left = X(P.x); d.style.top = Y(P.y);
      d.innerHTML = `<span class="ruby">${rubyHTML(P.zh, P.py)}</span><span class="en">${P.en}</span>`;
      map.appendChild(d);
      return;
    }
    const b = document.createElement('button');
    b.type = 'button';
    const soon = !P.games.length;
    b.className = 'spot' + (soon ? ' soon' : '');
    b.style.left = X(P.x); b.style.top = Y(P.y);
    b.style.setProperty('--c', (COLORS[P.color] || COLORS.me)[0]);
    b.innerHTML = `<span class="ruby">${rubyHTML(P.zh, P.py)}</span><span class="en">${P.en}</span>` + (soon ? '<span class="soonTag">Coming soon</span>' : '');
    b.setAttribute('aria-label', `${P.zh} ${P.en}${soon ? ' (coming soon)' : ''}`);
    if (soon) b.setAttribute('aria-disabled', 'true');
    else b.addEventListener('click', () => openTopic(P, b));
    map.appendChild(b);
  });
});

function openTopic(T, from) {
  lastFocus = from;
  panelTitle.innerHTML = `<span class="ruby">${rubyHTML(T.zh, T.py)}</span><span class="en">${T.en}</span>`;
  panelGames.innerHTML = gameCards(T);
  overlay.hidden = false;
  document.getElementById('closeBtn').focus();
}
function closePanel() { overlay.hidden = true; if (lastFocus) lastFocus.focus(); }
document.getElementById('closeBtn').addEventListener('click', closePanel);
overlay.addEventListener('click', e => { if (e.target === overlay) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closePanel(); });

// switching islands (#holiday opens the holiday island directly)
const brandRuby = document.getElementById('brandRuby'), brandEn = document.getElementById('brandEn');
document.getElementById('goHolidayRuby').innerHTML = rubyHTML('节日岛', 'jié rì dǎo');
let current = 'main';
function showIsland(id, animate) {
  current = id;
  const I = ISLANDS[id];
  brandRuby.innerHTML = rubyHTML(I.zh, I.py);
  brandEn.textContent = I.en;
  Object.keys(ISLANDS).forEach(k => {
    const sc = document.getElementById('scene-' + k);
    sc.hidden = (k !== id) || !list.hidden;
    sc.classList.remove('enter');
    if (k === id && animate) { void sc.offsetWidth; sc.classList.add('enter'); }
  });
  document.body.classList.toggle('holiday', id === 'holiday');
  try { history.replaceState(null, '', id === 'main' ? location.pathname : '#holiday'); } catch (e) {}
}
document.getElementById('goHoliday').addEventListener('click', () => showIsland('holiday', true));
document.getElementById('goMainRuby').innerHTML = rubyHTML('回主岛', 'huí zhǔ dǎo');
document.getElementById('goMain').addEventListener('click', () => showIsland('main', true));

// list view: every topic and its games, for a quick pick in class
const list = document.getElementById('list');
const listBtn = document.getElementById('listBtn');
list.innerHTML = Object.values(ISLANDS).map(I => `<h3>${I.en}</h3>` + I.places.filter(T => !T.labelOnly).map(T => `<section>
    <h2><span class="ruby">${rubyHTML(T.zh, T.py)}</span> ${T.en}</h2>
    ${T.games.length ? `<div class="games">${gameCards(T)}</div>` : '<p class="soonline">Coming soon</p>'}
  </section>`).join('')).join('');
listBtn.addEventListener('click', () => {
  const showList = list.hidden;
  list.hidden = !showList;
  listBtn.setAttribute('aria-pressed', String(showList));
  listBtn.textContent = showList ? '🏝 Island map' : '☰ All games';
  showIsland(current, false);
});

// #holiday opens the holiday island; #<place id> (e.g. #haunted-house) opens that place's game menu
(function () {
  const h = decodeURIComponent((location.hash || '').slice(1));
  let start = h === 'holiday' ? 'holiday' : 'main', place = null;
  Object.entries(ISLANDS).forEach(([k, I]) => I.places.forEach(P => { if (P.id && P.id === h) { start = k; place = P; } }));
  showIsland(start, false);
  if (place && place.games && place.games.length) {
    const btn = [...document.querySelectorAll('#scene-' + start + ' .spot')].find(b => (b.getAttribute('aria-label') || '').startsWith(place.zh + ' '));
    openTopic(place, btn || null);
  }
})();
</script>
</body>
</html>
