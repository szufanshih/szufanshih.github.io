<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>自由拨 Free Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 自由拨：一个可以随便拨的中国算盘，上课示范用。用法：abacus-free.html?unit=numbers */
body.game { background: #FFF8E1; }
.stage { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.readout { min-height: 118px; display: flex; align-items: flex-end; justify-content: center; gap: 22px; flex-wrap: wrap;
  background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 10px 24px; width: 100%; }
.readout .num { font: 700 64px/1.1 var(--f-latin); }
.readout .ruby .py { font-size: 19px; } .readout .ruby .zh { font-size: 44px; }
.readout .hiddenNote { font-size: 20px; color: var(--muted); align-self: center; }
.abBox { width: 100%; max-width: 720px; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.big { display: flex; flex-direction: column; align-items: center; cursor: pointer; font: 700 17px var(--f-latin); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 16px; padding: 6px 26px 8px; background: var(--card); box-shadow: 0 4px 0 var(--ink); }
.big .ruby .py { font-size: 14px; } .big .ruby .zh { font-size: 28px; }
.big[aria-pressed="true"] { background: #FFF1C7; }
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <button class="ctl" id="soundBtn" type="button"></button>
    </div>
  </div>
  <div class="stage">
    <div class="readout" id="readout" aria-live="polite"></div>
    <div class="abBox" id="abBox"></div>
    <div class="btns">
      <button type="button" class="big" id="showBtn"><span class="ruby" id="showRuby"></span><span id="showEn"></span></button>
      <button type="button" class="big" id="readBtn"><span class="ruby" id="readRuby"></span><span>🔊 Read it</span></button>
      <button type="button" class="big" id="clearBtn"><span class="ruby" id="clearRuby"></span><span>Clear</span></button>
    </div>
  </div>

<script src="../shared/common.js"></script>
<script src="../shared/numbers.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const N = ShihNum, C = UNIT.abacusFree;
  document.title = `${C.title.zh} ${C.title.en}`;
  document.getElementById('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  document.getElementById('titleEn').textContent = C.title.en;
  document.getElementById('readRuby').innerHTML = Shih.ruby('念', 'niàn');
  document.getElementById('clearRuby').innerHTML = Shih.ruby('清除', 'qīng chú');
  Shih.soundButton(document.getElementById('soundBtn'));
  const readout = document.getElementById('readout');
  let showNum = Shih.get('abacusShow', true);
  const ab = N.abacus(document.getElementById('abBox'), { cols: 5, interactive: true, onChange: paint });
  // 一档可以拨到 15（两颗上珠 + 五颗下珠），显示的是整个算盘的总数
  function paint() {
    const n = ab.get();
    if (!showNum) { readout.innerHTML = '<span class="hiddenNote">？ The number is hidden.</span>'; return; }
    readout.innerHTML = `<span class="num">${n}</span>` + (n <= 99999 ? N.ruby(n) : '');
  }
  const showBtn = document.getElementById('showBtn');
  function paintShow() {
    showBtn.setAttribute('aria-pressed', String(showNum));
    document.getElementById('showRuby').innerHTML = showNum ? Shih.ruby('藏起来', 'cáng qǐ lái') : Shih.ruby('显示数字', 'xiǎn shì shù zì');
    document.getElementById('showEn').textContent = showNum ? 'Hide the number' : 'Show the number';
    paint();
  }
  showBtn.addEventListener('click', () => { showNum = !showNum; Shih.set('abacusShow', showNum); paintShow(); });
  document.getElementById('readBtn').addEventListener('click', () => { Shih.speak(N.zh(ab.get())); });
  document.getElementById('clearBtn').addEventListener('click', () => ab.clear());
  paintShow();
});
</script>
</body>
</html>
