<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>鬼屋窗户 Haunted House Windows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 鬼屋窗户：点窗户，看里面有什么，回答问题。用法：windows.html?unit=halloween */
body.game { background: #EFEAF8; }
.stage { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }
.house { position: relative; width: 100%; aspect-ratio: 440 / 420; max-width: 560px; margin: 0 auto; }
.house svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wnd {
  position: absolute; transform: translate(-50%, -50%); width: 17%; aspect-ratio: 1 / 1;
  border: 4px solid #2B2B2B; border-radius: 8px; background: #3E3260; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center; font: 700 clamp(18px, 3vw, 30px) var(--f-latin); color: #F5C531;
  box-shadow: inset 0 0 0 4px #5E4B8B;
}
.wnd:hover:not(:disabled) { background: #4E3F78; }
.wnd:disabled { cursor: default; }
.wnd.open { background: #FFF6D6; box-shadow: none; }
.wnd.open svg { width: 86%; height: 86%; }
.wnd.done { border-color: var(--me-ink); background: #3E3260; box-shadow: inset 0 0 0 4px var(--me); color: var(--me); }
.wnd.active { outline: 5px solid #F5C531; outline-offset: 3px; }
.panel { background: var(--card); border: 3px solid #2B2B2B; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 360px; }
.asker { display: flex; align-items: flex-start; gap: 10px; }
.asker .ghost { width: 64px; flex: none; }
.bubble { position: relative; flex: 1; background: var(--night-soft); border: 3px solid var(--night); border-radius: 16px; padding: 10px 14px; }
.bubble::before { content: ""; position: absolute; left: -14px; top: 18px; border: 8px solid transparent; border-right-color: var(--night); border-width: 8px 14px 8px 0; }
.bubble .ruby .py { font-size: 16px; } .bubble .ruby .zh { font-size: 30px; }
.bubble .en { font-size: 16px; color: var(--muted); margin-top: 2px; }
.pic { display: flex; justify-content: center; }
.pic svg { width: 150px; height: 150px; }
.answers { display: flex; flex-direction: column; gap: 10px; }
.answers.row { flex-direction: row; justify-content: center; }
.ans {
  font: inherit; color: var(--ink); cursor: pointer; background: #FFF6D6; border: 3px solid #E9B949; border-radius: 14px;
  box-shadow: 0 4px 0 #C4932A; padding: 8px 14px; display: flex; justify-content: center;
}
.answers.row .ans { min-width: 130px; }
.ans .ruby .py { font-size: 15px; } .ans .ruby .zh { font-size: 28px; }
.ans.right { background: var(--me-done); border-color: var(--me-ink); box-shadow: 0 4px 0 var(--me-ink); }
.ans.wrong { animation: shake .35s; border-color: var(--bad); }
.idle { text-align: center; color: var(--muted); font-size: 18px; margin: auto 0; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill" id="timer">0:00</span>
      <button class="ctl" id="timerBtn" type="button"></button>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="stage">
        <div class="house" id="house">
          <svg class="bg" viewBox="0 0 440 420" aria-hidden="true">
            <g stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
              <path d="M40 410 L40 170 L110 112 L110 60 L140 60 L140 88 L220 22 L400 170 L400 410 Z" fill="#9B8BC4"/>
              <path d="M18 182 L220 10 L422 182" fill="none" stroke="#5E4B8B" stroke-width="16"/>
              <path d="M18 182 L220 10 L422 182" fill="none" stroke-width="5"/>
              <path d="M178 410 L178 340 Q220 300 262 340 L262 410 Z" fill="#3E3260"/>
              <circle cx="250" cy="372" r="4" fill="#F5C531"/>
              <path d="M20 410 L420 410" stroke-width="6"/>
              <path d="M300 60 q10 -10 20 0 q10 -10 20 0 M70 40 q8 -8 16 0 q8 -8 16 0" fill="none" stroke-width="3"/>
            </g>
          </svg>
        </div>
        <div class="panel" id="panel">
          <div class="asker">
            <svg class="ghost" viewBox="0 0 60 70" aria-hidden="true"><path d="M8 66 L8 28 C8 4 52 4 52 28 L52 66 L44 60 L37 67 L30 60 L23 67 L16 60 Z" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"/><circle cx="22" cy="28" r="3.5" fill="#2B2B2B"/><circle cx="38" cy="28" r="3.5" fill="#2B2B2B"/><ellipse cx="30" cy="40" rx="4" ry="5" fill="#2B2B2B"/><circle cx="15" cy="36" r="3" fill="#F7A8C4"/><circle cx="45" cy="36" r="3" fill="#F7A8C4"/></svg>
            <div class="bubble" id="bubble"></div>
          </div>
          <div class="pic" id="pic"></div>
          <div class="answers" id="answers"></div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/common.js"></script>
<script>
Shih.islandBar();
Promise.all([Shih.loadUnit(), Shih.loadArt()]).then(([UNIT, ART]) => {
  const C = UNIT.windows;
  const LEVELS = UNIT.levels || [{ note: '' }];
  document.title = `${C.title.zh} ${C.title.en}`;
  document.getElementById('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  document.getElementById('titleEn').textContent = C.title.en;
  document.getElementById('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');

  const house = document.getElementById('house'), bubble = document.getElementById('bubble');
  const pic = document.getElementById('pic'), answers = document.getElementById('answers');
  const scoreEl = document.getElementById('score'), winMsg = document.getElementById('winMsg'), winTime = document.getElementById('winTime');
  const timerEl = document.getElementById('timer'), timer = Shih.timer(timerEl);
  const timerOn = Shih.toggle(document.getElementById('timerBtn'), 'timer', '⏱ Timer on', '⏱ Timer off', true, on => { timerEl.hidden = !on; });
  Shih.soundButton(document.getElementById('soundBtn'));

  const pool = lv => UNIT.words.filter(w => (w.level || 1) <= lv && !(C.skip || []).includes(w.zh) && ART && ART.items[w.zh]);
  let level = Shih.startLevel('windowsLevel', LEVELS.length);
  const paintLevels = Shih.levelButtons(document.getElementById('levels'), LEVELS, level,
    lv => pool(lv).length, lv => { level = lv; Shih.set('windowsLevel', lv); setup(); }, UNIT.levelIcon);

  // window spots on the house picture (percent of the house box)
  const SPOTS = [[38, 31], [62, 31], [24, 53], [50, 53], [76, 53], [22, 78], [78, 78], [50, 31]].slice(0, C.count);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const say = t => `<span class="ruby">${Shih.rubyText(t.zh, t.py)}</span><div class="en">${Shih.esc(t.en || '')}</div>`;

  let wins = [], done = 0, active = null;
  const wait = Shih.startCover(document.getElementById('playArea'), () => { if (timerOn()) timer.start(); });

  function idle() {
    active = null;
    bubble.innerHTML = say(level && C.yesNoLevels.includes(level) ? { zh: '点一扇窗户。', py: 'diǎn yí shàn chuāng hu.', en: 'Tap a window.' } : C.openQ);
    pic.innerHTML = '';
    answers.className = 'answers';
    answers.innerHTML = `<p class="idle">Tap a window to open it.</p>`;
    wins.forEach(w => { w.el.disabled = w.done; w.el.classList.remove('active'); });
  }

  function setup() {
    paintLevels(level);
    house.querySelectorAll('.wnd').forEach(e => e.remove());
    const P = pool(level);
    let picks = shuffle(P);
    while (picks.length < SPOTS.length) picks = picks.concat(shuffle(P));
    wins = SPOTS.map(([x, y], i) => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'wnd';
      el.style.left = x + '%'; el.style.top = y + '%';
      el.textContent = i + 1;
      el.setAttribute('aria-label', 'Window ' + (i + 1));
      house.appendChild(el);
      const w = { el, item: picks[i], done: false };
      el.addEventListener('click', () => openWindow(w));
      return w;
    });
    done = 0; timer.reset(); winMsg.hidden = true; update();
    idle();
    wait();
  }
  function update() { scoreEl.textContent = `${done} / ${wins.length}`; }

  function openWindow(w) {
    if (w.done || active) return;
    active = w;
    w.el.classList.add('open', 'active');
    w.el.innerHTML = ART.items[w.item.zh];
    wins.forEach(o => { if (o !== w) o.el.disabled = true; });
    pic.innerHTML = ART.items[w.item.zh];
    const P = pool(level);
    if (C.yesNoLevels.includes(level)) {
      // yes / no: ask about one thing; half the time it is what's in the window
      const other = shuffle(P.filter(x => x.zh !== w.item.zh))[0];
      const asked = Math.random() < 0.5 || !other ? w.item : other;
      const q = Shih.fill(C.yesNoQ, asked);
      bubble.innerHTML = say(q);
      Shih.speak(q.zh);
      const isYes = asked.zh === w.item.zh;
      answers.className = 'answers row';
      answers.innerHTML = '';
      [[C.yes, true], [C.no, false]].forEach(([t, val]) => answers.appendChild(answerBtn(t, val === isYes, () => Shih.speak(t.zh))));
    } else {
      bubble.innerHTML = say(C.openQ);
      Shih.speak(C.openQ.zh);
      const opts = shuffle([w.item].concat(shuffle(P.filter(x => x.zh !== w.item.zh)).slice(0, 2)));
      answers.className = 'answers';
      answers.innerHTML = '';
      opts.forEach(o => { const t = Shih.fill(C.openA, o); answers.appendChild(answerBtn(t, o.zh === w.item.zh, () => Shih.speak(t.zh))); });
    }
  }
  function answerBtn(t, correct, onRight) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ans';
    b.innerHTML = `<span class="ruby">${Shih.rubyText(t.zh, t.py)}</span>`;
    b.addEventListener('click', () => {
      if (!active) return;
      if (!correct) { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); return; }
      b.classList.add('right'); onRight();
      const w = active; w.done = true; w.el.classList.remove('active');
      // close the window again after a moment, so only one window is open at a time
      setTimeout(() => { w.el.classList.remove('open'); w.el.classList.add('done'); w.el.textContent = '✓'; w.el.setAttribute('aria-label', 'Window done'); }, 900);
      done++; update();
      answers.querySelectorAll('.ans').forEach(x => x.disabled = true);
      active = null;
      if (done === wins.length) {
        const ms = timer.stop();
        winTime.textContent = timerOn() ? 'Time: ' + Shih.fmt(ms) : '';
        setTimeout(() => { winMsg.hidden = false; idle(); }, 900);
      } else setTimeout(idle, 1100);
    });
    return b;
  }
  document.getElementById('resetBtn').addEventListener('click', setup);
  document.getElementById('againBtn').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
